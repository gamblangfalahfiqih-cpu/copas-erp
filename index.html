        // 2. Modal Pembayaran dengan Pilihan DP (50%) atau Lunas
function openBookingPaymentModal(code) {
    const res = reservations.find(r => r.code === code);
    if (!res) return;

    // Total estimasi tagihan meja / reservasi standar (misal Rp 100.000)
    const totalBill = 100000; 
    const dpAmount = totalBill * 0.5; // Hitung otomatis 50%

    const modal = document.getElementById('global-modal');
    const box = document.getElementById('modal-box');

    box.innerHTML = `
        <div class="text-center space-y-4">
            <h3 class="font-bold text-lg text-gray-800">Pilih Jenis Pembayaran Reservasi</h3>
            <p class="text-sm text-gray-500">Kode Booking: <b>${res.code}</b> (${res.name})</p>
            
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="selectBookingType('${res.code}', 'DP', ${dpAmount})" class="p-4 border-2 border-amber-500 bg-amber-50 rounded-2xl text-left transition-all">
                    <div class="text-xs font-semibold text-gray-500 uppercase">Down Payment</div>
                    <div class="text-lg font-extrabold text-amber-700">Rp ${dpAmount.toLocaleString()}</div>
                    <div class="text-[10px] text-amber-600 mt-1">Perhitungan 50% dari total</div>
                </button>
                <button onclick="selectBookingType('${res.code}', 'Lunas', ${totalBill})" class="p-4 border-2 border-emerald-500 bg-emerald-50 rounded-2xl text-left transition-all">
                    <div class="text-xs font-semibold text-gray-500 uppercase">Bayar Lunas</div>
                    <div class="text-lg font-extrabold text-emerald-700">Rp ${totalBill.toLocaleString()}</div>
                    <div class="text-[10px] text-emerald-600 mt-1">Pelunasan 100% di awal</div>
                </button>
            </div>

            <div id="booking-method-container" class="mt-4 pt-4 border-t hidden">
                <!-- Pilihan metode bayar & barcode muncul di sini -->
            </div>

            <div class="flex justify-end gap-2 pt-4">
                <button onclick="document.getElementById('global-modal').classList.add('hidden')" class="px-4 py-2 border rounded-xl text-sm">Tutup</button>
            </div>
        </div>
    `;
    modal.classList.remove('hidden');
}

// 3. Menampilkan Metode Pembayaran (Tunai / QRIS / Transfer) setelah pilih DP/Lunas
function selectBookingType(code, type, amount) {
    const container = document.getElementById('booking-method-container');
    container.classList.remove('hidden');

    container.innerHTML = `
        <div class="space-y-3">
            <p class="text-xs font-bold text-gray-700">Metode Pembayaran untuk (${type}): <span class="text-amber-700">Rp ${amount.toLocaleString()}</span></p>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="finalizeBookingPayment('${code}', '${type}', 'Tunai', ${amount})" class="p-2.5 border rounded-xl font-semibold text-xs hover:bg-gray-100">💵 Tunai</button>
                <button onclick="selectBookingQRIS('${code}', '${type}', ${amount})" class="p-2.5 border rounded-xl font-semibold text-xs hover:bg-gray-100">📱 QRIS</button>
                <button onclick="finalizeBookingPayment('${code}', '${type}', 'Transfer Bank', ${amount})" class="p-2.5 border rounded-xl font-semibold text-xs hover:bg-gray-100">💳 Transfer</button>
            </div>
            <div id="booking-qris-area"></div>
        </div>
    `;
}

// 4. Munculkan Barcode QRIS khusus Booking
function selectBookingQRIS(code, type, amount) {
    const qrisArea = document.getElementById('booking-qris-area');
    qrisArea.innerHTML = `
        <div class="mt-3 flex flex-col items-center space-y-2 bg-gray-50 p-3 rounded-xl border">
            <p class="text-xs text-gray-600">Scan Barcode QRIS (${type}):</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=BOOKING-${code}-${type}-${amount}" class="w-32 h-32">
            <button onclick="finalizeBookingPayment('${code}', '${type}', 'QRIS', ${amount})" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-xs font-semibold shadow-sm">Konfirmasi Pembayaran QRIS Sukses</button>
        </div>
    `;
}

// 5. Finalisasi Pembayaran & Membersihkan Halaman jika Lunas
function finalizeBookingPayment(code, type, method, amount) {
    const res = reservations.find(r => r.code === code);
    if (res) {
        if (type === 'Lunas') {
            res.status = 'Lunas'; // Status lunas akan otomatis memfilternya keluar dari daftar aktif
        } else {
            res.status = 'DP 50% (Confirmed)';
        }
    }
    document.getElementById('global-modal').classList.add('hidden');
    showToast(`Pembayaran ${type} reservasi ${code} via ${method} (Rp ${amount.toLocaleString()}) berhasil!`, 'success');
    renderContent('kasir-booking');
}

        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.s-btn').forEach(b => {
                b.classList.remove('bg-amber-50', 'text-amber-700', 'font-semibold');
                b.classList.add('text-gray-600', 'font-medium');
                if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(tabId)) {
                    b.classList.add('bg-amber-50', 'text-amber-700', 'font-semibold');
                    b.classList.remove('text-gray-600', 'font-medium');
                }
            });
            renderContent(tabId);
        }

        function saveMenu(id) {
            const name = document.getElementById('m-name').value;
            const cat = document.getElementById('m-cat').value;
            const price = parseInt(document.getElementById('m-price').value);

            if (!name || isNaN(price)) {
                showToast('Mohon isi nama dan harga dengan benar.', 'error');
                return;
            }

            if (id === null) {
                const newId = menus.length > 0 ? Math.max(...menus.map(m => m.id)) + 1 : 1;
                menus.push({ id: newId, name, cat, price, stock: 'Aman', img: 'https://placehold.co/100x100/d97706/ffffff?text=Menu' });
                showToast('Menu baru berhasil ditambahkan.', 'success');
            } else {
                const m = menus.find(x => x.id === id);
                if (m) {
                    m.name = name;
                    m.cat = cat;
                    m.price = price;
                    showToast('Menu berhasil diperbarui.', 'success');
                }
            }
            document.getElementById('global-modal').classList.add('hidden');
            renderContent('admin-menu');
        }

        function deleteMenu(id) {
            menus = menus.filter(m => m.id !== id);
            showToast('Menu berhasil dihapus.', 'success');
            renderContent('admin-menu');
        }

        // 2. Manajemen Pegawai (Admin)
        function openAddEmployeeModal() {
            document.getElementById('add-employee-card').classList.toggle('hidden');
        }

        function saveNewEmployee() {
            const name = document.getElementById('new-emp-name').value;
            const role = document.getElementById('new-emp-role').value;
            const shift = document.getElementById('new-emp-shift').value;

            if (!name) {
                showToast('Mohon masukkan nama lengkap pegawai.', 'error');
                return;
            }

            const newId = 'EMP-0' + (employees.length + 1);
            employees.push({ id: newId, name, role, shift, status: 'Aktif' });
            document.getElementById('add-employee-card').classList.add('hidden');
            renderContent('admin-users');
            showToast(`Pegawai ${name} berhasil didaftarkan.`, 'success');
        }

        function removeEmployee(id) {
            employees = employees.filter(e => e.id !== id);
            renderContent('admin-users');
            showToast('Data pegawai dihapus.', 'success');
        }

        // 3. Modul Pemesanan (Pelayan) & Keranjang
        function addToCart(menuId) {
            const menu = menus.find(m => m.id === menuId);
            const exist = activeCart.find(i => i.id === menuId);
            if (exist) {
                exist.qty++;
            } else {
                activeCart.push({ id: menu.id, name: menu.name, price: menu.price, qty: 1 });
            }
            renderContent('pelayan-pesanan');
            showToast(`${menu.name} ditambahkan ke keranjang.`, 'success');
        }

        function removeFromCart(idx) {
            activeCart.splice(idx, 1);
            renderContent('pelayan-pesanan');
        }

        function submitOrder() {
            if (activeCart.length === 0) {
                showToast('Keranjang pesanan masih kosong.', 'error');
                return;
            }
            const table = document.getElementById('order-table').value;
            const customer = document.getElementById('order-customer').value || 'Pelanggan Umum';
            const total = activeCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const itemsStr = activeCart.map(i => `${i.qty}x ${i.name}`).join(', ');

            const newOrd = {
                id: 'ORD-00' + (orders.length + 1),
                table,
                customer,
                items: itemsStr,
                total,
                status: 'Menunggu',
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB'
            };

            orders.push(newOrd);
            activeCart = [];
            showToast('Pesanan berhasil dikirim ke Dapur!', 'success');
            switchTab('pelayan-monitoring');
        }

        // 4. Pembatalan & Pemrosesan Status Pesanan (Kasir / Dapur / Pelayan)
        function updateOrderStatus(orderId, newStatus) {
            const ord = orders.find(o => o.id === orderId);
            if (ord) {
                ord.status = newStatus;
                showToast(`Status pesanan ${orderId} diubah menjadi ${newStatus}`, 'success');
                if (currentRole === 'dapur') renderContent('dapur-pesanan');
                else if (currentRole === 'pelayan') renderContent('pelayan-monitoring');
            }
        }

        function markServed(orderId) {
            updateOrderStatus(orderId, 'Selesai');
        }

        function cancelOrder(orderId) {
            orders = orders.filter(o => o.id !== orderId);
            showToast(`Pesanan ${orderId} telah dibatalkan.`, 'error');
            if (currentRole === 'kasir') renderContent('kasir-transaksi');
            else if (currentRole === 'pelayan') renderContent('pelayan-monitoring');
        }

        function payOrder(orderId) {
            const ord = orders.find(o => o.id === orderId);
            if (ord) {
                ord.status = 'Selesai';
                orders = orders.filter(o => o.id !== orderId); // Selesaikan transaksi dari antrean bayar
                showToast(`Pembayaran ${orderId} lunas! Struk tercetak.`, 'success');
                renderContent('kasir-transaksi');
            }
        }

        // Membuka Modal Pilihan Pembayaran & Barcode
function openPaymentModal(orderId) {
    const ord = orders.find(o => o.id === orderId);
    if (!ord) return;

    const modal = document.getElementById('global-modal');
    const box = document.getElementById('modal-box');

    box.innerHTML = `
        <div class="text-center space-y-4">
            <h3 class="font-bold text-lg text-gray-800">Pilih Metode Pembayaran</h3>
            <p class="text-sm text-gray-500">Total Tagihan untuk <b>${ord.id}</b> (${ord.customer}):</p>
            <div class="text-2xl font-extrabold text-amber-700">Rp ${ord.total.toLocaleString()}</div>
            
            <div class="grid grid-cols-3 gap-2 pt-2">
                <button onclick="selectPaymentMethod('${ord.id}', 'Tunai')" class="p-3 border rounded-xl font-semibold text-xs hover:bg-amber-50 hover:border-amber-500 transition-all">💵 Tunai (Cash)</button>
                <button onclick="selectPaymentMethod('${ord.id}', 'QRIS')" class="p-3 border rounded-xl font-semibold text-xs hover:bg-amber-50 hover:border-amber-500 transition-all">📱 QRIS (Barcode)</button>
                <button onclick="selectPaymentMethod('${ord.id}', 'Transfer')" class="p-3 border rounded-xl font-semibold text-xs hover:bg-amber-50 hover:border-amber-500 transition-all">💳 Transfer Bank</button>
            </div>

            <div id="payment-action-area" class="mt-4 pt-4 border-t hidden">
                <!-- Area Dinamis Barcode / Tunai -->
            </div>

            <div class="flex justify-end gap-2 pt-4">
                <button onclick="document.getElementById('global-modal').classList.add('hidden')" class="px-4 py-2 border rounded-xl text-sm">Tutup</button>
            </div>
        </div>
    `;
    modal.classList.remove('hidden');
}

// Handler pemilihan metode pembayaran
function selectPaymentMethod(orderId, method) {
    const ord = orders.find(o => o.id === orderId);
    const actionArea = document.getElementById('payment-action-area');
    actionArea.classList.remove('hidden');

    if (method === 'Tunai') {
        actionArea.innerHTML = `
            <div class="space-y-3 text-left">
                <label class="block text-xs font-semibold text-gray-500 uppercase">Uang Diterima dari Pelanggan</label>
                <input type="number" id="cash-given" placeholder="Cth. 50000" class="w-full bg-gray-50 border rounded-xl px-3 py-2 text-sm">
                <button onclick="processCashPayment('${ord.id}', ${ord.total})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Selesaikan & Cetak Struk</button>
            </div>
        `;
    } else if (method === 'QRIS') {
        actionArea.innerHTML = `
            <div class="space-y-3 flex flex-col items-center">
                <p class="text-xs font-semibold text-gray-600">Scan Barcode QRIS di bawah menggunakan GoPay, OVO, Dana, atau M-Banking:</p>
                <!-- Simulasi Barcode menggunakan gambar placeholder QR -->
                <div class="bg-white p-3 border-2 border-dashed border-amber-500 rounded-2xl inline-block shadow-xs">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=COPAS-ERP-PAYMENT-${ord.id}-${ord.total}" alt="QRIS Barcode" class="w-36 h-36 mx-auto">
                </div>
                <p class="text-xs text-amber-700 font-bold">NMID: ID102938475692 - Warung Copas</p>
                <button onclick="finalizePayment('${ord.id}', 'QRIS')" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm">Konfirmasi Pembayaran Berhasil</button>
            </div>
        `;
    } else if (method === 'Transfer') {
        actionArea.innerHTML = `
            <div class="space-y-3 text-left bg-gray-50 p-3 rounded-xl border text-xs">
                <p class="font-bold text-gray-700">Silakan Transfer ke Rekening Warung Copas:</p>
                <p>Bank BCA: <b class="text-amber-700">1234-5678-90</b> (a.n. Warung Copas)</p>
                <button onclick="finalizePayment('${ord.id}', 'Transfer Bank')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl text-sm font-semibold shadow-sm mt-2">Konfirmasi Mutasi Masuk</button>
            </div>
        `;
    }
}

// Proses Pembayaran Tunai dengan Hitung Kembalian
function processCashPayment(orderId, total) {
    const given = parseInt(document.getElementById('cash-given').value);
    if (isNaN(given) || given < total) {
        showToast('Jumlah uang tunai kurang dari total tagihan!', 'error');
        return;
    }
    const change = given - total;
    finalizePayment(orderId, `Tunai (Kembalian: Rp ${change.toLocaleString()})`);
}

// Finalisasi Transaksi
function finalizePayment(orderId, methodInfo) {
    orders = orders.filter(o => o.id !== orderId);
    document.getElementById('global-modal').classList.add('hidden');
    showToast(`Pembayaran ${orderId} lunas via ${methodInfo}! Struk berhasil dicetak.`, 'success');
    renderContent('kasir-transaksi');
}

        // 5. Konfirmasi & Pembatalan Booking (Kasir)
        function updateReservationStatus(code, status) {
            const res = reservations.find(r => r.code === code);
            if (res) {
                res.status = status;
                showToast(`Reservasi ${code} diperbarui menjadi ${status}`, status === 'Cancelled' ? 'error' : 'success');
                renderContent('kasir-booking');
            }
        }

        // 6. Presensi Mandiri Karyawan
        function doClockIn() {
            const t = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
            attendanceState.status = 'Hadir (Bertugas)';
            attendanceState.clockIn = t;
            if(document.getElementById('att-text')) {
                document.getElementById('att-text').innerText = attendanceState.status;
                document.getElementById('att-in').innerText = t;
            }
            showToast(`Presensi masuk tercatat pada ${t}`, 'success');
        }

        function doClockOut() {
            const t = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
            attendanceState.status = 'Selesai Shift';
            attendanceState.clockOut = t;
            if(document.getElementById('att-text')) {
                document.getElementById('att-text').innerText = attendanceState.status;
                document.getElementById('att-out').innerText = t;
            }
            showToast(`Presensi pulang tercatat pada ${t}`, 'success');
        }

        // 7. Booking Online Pelanggan & Cek Status
        function submitBookingCustomer() {
            const name = document.getElementById('b-name').value;
            const phone = document.getElementById('b-phone').value;
            const date = document.getElementById('b-date').value || '2026-06-06';
            const time = document.getElementById('b-time').value || '19:00';
            const pax = document.getElementById('b-pax').value;
            const table = document.getElementById('b-table').value;

            if (!name || !phone) {
                showToast('Mohon lengkapi nama dan nomor WhatsApp.', 'error');
                return;
            }

            const randCode = 'COP-' + Math.floor(1000 + Math.random() * 9000);
            reservations.push({ code: randCode, name, date, time, pax, table, status: 'Pending', phone });
            showToast(`Booking berhasil! Kode reservasi Anda: ${randCode}`, 'success');
            switchTab('pelanggan-status');
        }

        function checkBooking() {
            const code = document.getElementById('chk-code').value.trim().toUpperCase();
            const res = reservations.find(r => r.code === code);
            const resBox = document.getElementById('chk-result');
            if (res) {
                document.getElementById('res-status-badge').innerText = `Status: ${res.status}`;
                document.getElementById('res-name').innerText = res.name;
                document.getElementById('res-table').innerText = `${res.table} (${res.pax} Orang - ${res.date} ${res.time} WIB)`;
                resBox.classList.remove('hidden');
                showToast('Data reservasi ditemukan.', 'success');
            } else {
                resBox.classList.add('hidden');
                showToast('Kode booking tidak ditemukan.', 'error');
            }
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const m = document.getElementById('toast-msg');
            const bg = document.getElementById('toast-bg');
            const icon = document.getElementById('toast-icon');

            m.innerText = msg;
            if (type === 'success') {
                bg.className = 'flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-white font-medium bg-emerald-600 border-emerald-700';
                icon.className = 'fa-solid fa-circle-check text-xl';
            } else if (type === 'error') {
                bg.className = 'flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-white font-medium bg-red-600 border-red-700';
                icon.className = 'fa-solid fa-triangle-exclamation text-xl';
            } else {
                bg.className = 'flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-white font-medium bg-amber-600 border-amber-700';
                icon.className = 'fa-solid fa-circle-info text-xl';
            }

            t.classList.remove('translate-y-20', 'opacity-0');
            t.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                t.classList.remove('translate-y-0', 'opacity-100');
                t.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }
    </script>
